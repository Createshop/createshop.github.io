const CATS=["Alle",...new Set(ITEMS.map(i=>i.c))];let cat="Alle",term="",cur=null;
const $=id=>document.getElementById(id);
const ico=c=>`<div class="ico" style="background:linear-gradient(135deg,rgba(255,255,255,.28) 0 25%,transparent 25% 50%,rgba(0,0,0,.18) 50% 75%,transparent 75%) 0 0/14px 14px,${c}"></div>`;
let LIM0=300;function render(){
$("tabs").innerHTML=CATS.map(c=>`<button class="tab ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
const l=ITEMS.map((it,i)=>[it,i]).filter(([it])=>(cat==="Alle"||it.c===cat)&&it.n.toLowerCase().includes(term));
$("cnt").textContent=l.length+" Items";const sh=l.slice(0,LIM0);
$("grid").innerHTML=sh.map(([it,i])=>`<div class="item"><div class="top">${ico(it.col)}<div><div class="name">${it.n}</div><div class="sub">${it.c}</div></div></div><div>${it.p?it.p+" $ · VB":"Preis auf Anfrage"}</div><button class="btn go" data-i="${i}">Anfrage / verhandeln</button></div>`).join("")+(l.length>LIM0?`<button class="btn" data-more="1">Mehr anzeigen (${l.length-LIM0})</button>`:"");}
function upd(){
if(!cur)return;const q=+$("fq").value||1,p=$("fp").value;
const body=`Hallo,\n\nich interessiere mich für:\n${q}x ${cur.n}\n\nMein Angebot: ${p||"?"} $ (gesamt)\nDein Preis: ${cur.p?cur.p*q+" $ (VB)":"auf Anfrage"}\n\nMinecraft-Name: ${$("fn").value||"-"}\nMeine E-Mail: ${$("fe").value||"-"}\n\n${$("fm").value}`;
const sub=`Shop-Anfrage: ${q}x ${cur.n}`;
$("send").href=`mailto:${OWNER_EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
$("send").dataset.t=`An: ${OWNER_EMAIL}\nBetreff: ${sub}\n\n${body}`;}
document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;
if(t.dataset.more){LIM0+=300;render()}
else if(t.dataset.c){cat=t.dataset.c;LIM0=300;render()}
else if(t.dataset.i){cur=ITEMS[+t.dataset.i];$("mt").textContent=cur.n;$("fq").value=1;$("fp").value=cur.p||"";$("ask").textContent=cur.p?`Richtpreis: ${cur.p} $ pro Stück – Verhandlungsbasis`:"Preis auf Anfrage";$("m").classList.add("on");upd()}
else if(t.id==="close")$("m").classList.remove("on");
else if(t.id==="copy"){const x=$("send").dataset.t;try{navigator.clipboard.writeText(x).then(()=>t.textContent="Kopiert ✓")}catch(_){t.textContent="Bitte manuell kopieren"}}});
document.querySelectorAll("#m input,#m textarea").forEach(e=>e.addEventListener("input",upd));
$("q").addEventListener("input",e=>{term=e.target.value.toLowerCase().trim();LIM0=300;render()});
render();
</script></body></html>
